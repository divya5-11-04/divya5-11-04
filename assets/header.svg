<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0f2027"/><stop offset="0.5" stop-color="#2c5364"/><stop offset="1" stop-color="#00c9a7"/>
<animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
</linearGradient>
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
.n{fill:#fff;opacity:.5}
.f1{animation:fl 6s ease-in-out infinite}
.f2{animation:fl 8s ease-in-out infinite reverse}
.f3{animation:fl 7s ease-in-out infinite 1s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.name{opacity:0;animation:in 1.2s ease-out .2s forwards}
.sub{opacity:0;animation:in 1.2s ease-out .9s forwards}
.sub2{opacity:0;animation:in 1.2s ease-out 1.5s forwards}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:p 2.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes p{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.8;transform:scale(1.6)}}
</style>
</defs>
<rect width="900" height="260" rx="16" fill="url(#bg)"/>
<g class="f1"><line x1="90" y1="60" x2="200" y2="120" stroke="#fff" opacity=".25"/><line x1="200" y1="120" x2="140" y2="200" stroke="#fff" opacity=".25"/><circle class="n pulse" cx="90" cy="60" r="5"/><circle class="n pulse" cx="200" cy="120" r="6"/><circle class="n pulse" cx="140" cy="200" r="4"/></g>
<g class="f2"><line x1="760" y1="50" x2="830" y2="130" stroke="#fff" opacity=".25"/><line x1="830" y1="130" x2="720" y2="200" stroke="#fff" opacity=".25"/><circle class="n pulse" cx="760" cy="50" r="5"/><circle class="n pulse" cx="830" cy="130" r="6"/><circle class="n pulse" cx="720" cy="200" r="4"/></g>
<g class="f3"><circle class="n pulse" cx="600" cy="40" r="3"/><circle class="n pulse" cx="300" cy="225" r="3"/><circle class="n pulse" cx="520" cy="230" r="4"/></g>
<text class="t name" x="450" y="120" text-anchor="middle" font-size="58" font-weight="700">Hi, I'm Divya 👋</text>
<text class="t sub" x="450" y="165" text-anchor="middle" font-size="22">I build AI that works on factory floors and in the real world</text>
<text class="t sub2" x="450" y="205" text-anchor="middle" font-size="16" opacity=".85" font-family="monospace">Computer Vision · GenAI · Robotics · Full Stack</text>
</svg>
